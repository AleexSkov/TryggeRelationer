name: Deploy TryggeRelationer

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish TryggeRelationer/TryggeRelationer.csproj -c Release

      - name: Deploy to one.com
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.ONE_HOST }}
          username: ${{ secrets.ONE_USERNAME }}
          password: ${{ secrets.ONE_PASSWORD }}
          port: ${{ secrets.ONE_PORT }}
          local_path: './TryggeRelationer/bin/Release/net10.0/publish/wwwroot/*'
          remote_path: '/customers/6/l/c/cuons8cvm/webroots/c4cb5160/'
          sftp_only: true
          ssh_private_key: ${{ secrets.ONE_SSH_KEY }}